<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="topbar">
        <div class="logo">Air-Bridge</div>
        <nav>
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/chat">Chat</a>
            <a href="/contacts">Contacts</a>
            <a href="/groups">Groups</a>
        </nav>
    </header>

    <main class="container dashboard">
        <h2>Dashboard</h2>
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Online Devices</h3>
                <p>24</p>
            </div>
            <div class="stat-card">
                <h3>Messages</h3>
                <p>780</p>
            </div>
            <div class="stat-card">
                <h3>Files Sent</h3>
                <p>132</p>
            </div>
        </div>
    </main>
</body>
</html>
