<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile – Air-Bridge</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="topbar">
        <div class="logo">✈ Air-Bridge</div>
        <nav>
            <a th:href="@{/profile}">← Profile</a>
            <a th:href="@{/logout}">Logout</a>
        </nav>
    </header>

    <div class="auth-bg">
        <div class="auth-card wide">
            <div class="auth-logo">
                <div class="brand">Edit Profile</div>
                <p>Update your personal information</p>
            </div>

            <form th:action="@{/profile/edit}" method="post">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="fullName" th:value="${user.fullName}" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" name="phoneNumber" th:value="${user.phoneNumber}" placeholder="Optional">
                </div>
                <div class="form-group">
                    <label>About</label>
                    <textarea name="about" rows="3" placeholder="Tell something about yourself" th:text="${user.about}"></textarea>
                </div>
                <button type="submit">Save Changes</button>
            </form>

            <div class="auth-footer">
                <a th:href="@{/profile}">Cancel</a>
            </div>
        </div>
    </div>
</body>
</html>
