<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – Air-Bridge</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="auth-bg">
        <div class="auth-card wide">
            <div class="auth-logo">
                <div class="brand">✈ Air-Bridge</div>
                <p>Create your account</p>
            </div>

            <div th:if="${errorMessage}" class="alert error" th:text="${errorMessage}"></div>

            <form th:action="@{/register}" th:object="${registerRequest}" method="post">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" th:field="*{fullName}" placeholder="John Doe">
                    <p class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
                </div>
                <div class="form-group">
                    <label>Email address</label>
                    <input type="email" th:field="*{email}" placeholder="you@example.com">
                    <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" th:field="*{password}" placeholder="Min. 6 characters">
                    <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" th:field="*{confirmPassword}" placeholder="Repeat your password">
                    <p class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></p>
                </div>

                <button type="submit">Create Account</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a th:href="@{/login}">Sign in</a>
            </div>
        </div>
    </div>
</body>
</html>
